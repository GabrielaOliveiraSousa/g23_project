<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Podcast Management Dashboard</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css')}}">
        
        <style>
            .dashboard-container {
                display: flex;
                flex-direction: row;
                justify-content: flex-start;
                align-items: flex-start;
                gap: 30px;
                padding: 30px;
                flex-wrap: wrap;
            }
            .coluna-esquerda {
                flex: 0 0 auto;
            }
            .coluna-direita {
                flex: 1;
                min-width: 320px;
            }
            
            .dados.input-focado {
                border-color: #ffb7ce;
                box-shadow: 0 10px 30px rgba(255, 182, 193, 0.25);
                transform: scale(1.01);
                transition: all 0.3s ease;
            }

            /* ==========================================
               ESTILOS DO MODAL INTERATIVO
               ========================================== */
            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(255, 240, 243, 0.8); /* Fundo rosa transparente */
                backdrop-filter: blur(5px); /* Efeito desfocado chic */
                display: flex;
                justify-content: center;
                align-items: center;
                opacity: 0;
                pointer-events: none;
                transition: all 0.3s ease;
                z-index: 999;
            }

            .modal-overlay.active {
                opacity: 1;
                pointer-events: auto;
            }

            .modal-box {
                background: #ffffff;
                padding: 35px;
                border-radius: 20px;
                border: 2px solid #ffe4ec;
                box-shadow: 0 15px 35px rgba(255, 133, 162, 0.2);
                text-align: center;
                max-width: 400px;
                transform: scale(0.8);
                transition: all 0.3s ease;
            }

            .modal-overlay.active .modal-box {
                transform: scale(1);
            }

            .modal-box h2 {
                color: #ff6595;
                font-size: 1.6em;
                margin-bottom: 10px;
            }

            .modal-box p {
                color: #6b5a5e;
                margin-bottom: 25px;
                font-size: 0.95em;
            }

            .modal-buttons {
                display: flex;
                justify-content: center;
                gap: 12px;
            }

            /* Botão de sair com brilho rosa */
            .btn-exit-confirm {
                background-color: #ff85a2;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 10px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
            }
            .btn-exit-confirm:hover {
                background-color: #ff6595;
                box-shadow: 0 5px 15px rgba(255, 101, 149, 0.4);
            }

            /* Botão de voltar atrás */
            .btn-stay {
                background-color: #fff0f3;
                color: #ff6595;
                border: 1px solid #ffe4ec;
                padding: 10px 20px;
                border-radius: 10px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
            }
            .btn-stay:hover {
                background-color: #ffe4ec;
            }
        </style>
    </head>
    <body>
        
        <div class="dashboard-container">
            
            <!-- PARTE SUPERIOR ESQUERDA: Form de Podcasts -->
            <div class="coluna-esquerda">
                <div class="dados" id="podcastCard">
                    <h1>Podcasts</h1>
                    <br>
                    <button id="edit" type="button" {{butshow}} onclick="window.location.href = '/?option=edit'" class="button1">Edit</button>
                    <button id="delete" type="button" {{butshow}} onclick="confirmarDelete(event)" class="button1">Delete</button>
                    <button id="insert" type="button" {{butshow}} onclick="window.location.href = '/?option=insert'" class="button1">Insert</button>
                    <button id="save" type="submit" form="form" {{butedit}} class="button1">Save</button>
                    <button id="cancel" type="button" {{butedit}} onclick="window.location.href = '/?option=cancel'" class="button1">Cancel</button>
                    
                    <button id="exit" type="button" {{butshow}} onclick="abrirModalExit(event)" class="button1">Exit</button>
                    <br><br>
                    
                    <form id="form" action="/?option=save" method="post">
                        <label for="id">Id:</label>
                        {% if butedit == 'enabled' %}
                            <input type="text" disabled id="id" name="id" value="{{id}}" size="5" class="meu-input"/>
                        {%else%}
                            <input type="text" {{butedit}} id="id" name="id" value="{{id}}" size="10" class="meu-input"/>
                        {%endif%}
                        <br><br>
                        
                        <label for="title">Title:</label>
                        <input type="text" {{butedit}} id="title" name="title" value="{{title}}" size="30" class="meu-input"/>
                        <br><br>
                        
                        <label for="category">Category:</label>
                        <input type="text" {{butedit}} id="category" name="category" value="{{category}}" size="10" class="meu-input"/>
                        <br><br>
                        
                        <label for="date">Date:</label>
                        <input type="text" {{butedit}} id="date" name="date" value="{{date}}" size="10" class="meu-input"/>
                    </form>
                    <br>
                    
                    <button id="first" type="button" {{butshow}} onclick="window.location.href = '/?option=first'" class="button1">First</button>
                    <button id="previous" type="button" {{butshow}} onclick="window.location.href = '/?option=previous'" class="button1">Previous</button>
                    <button id="next" type="button" {{butshow}} onclick="window.location.href = '/?option=next'" class="button1">Next</button>
                    <button id="last" type="button" {{butshow}} onclick="window.location.href = '/?option=last'" class="button1">Last</button>
                </div>
            </div>
            
            <div class="coluna-direita">
            </div>

        </div>

        <!-- ==========================================
             ESTRUTURA DO POP-UP (MODAL) DE EXIT
             ========================================== -->
        <div class="modal-overlay" id="exitModal">
            <div class="modal-box">
                <h2>Saír? 🌸</h2>
                <p>Tens a certeza de que queres fechar o gestor de podcasts?</p>
                <div class="modal-buttons">
                    <button class="btn-exit-confirm" onclick="confirmarSaida()">Sim, Sair</button>
                    <button class="btn-stay" onclick="fecharModalExit()">Ficar aqui</button>
                </div>
            </div>
        </div>

        <!-- ==========================================
             JAVASCRIPT
             ========================================== -->
        <script>
            // 1. Funções do Modal de Exit Interativo
            function abrirModalExit(event) {
                event.preventDefault(); // Trava a mudança imediata
                document.getElementById('exitModal').classList.add('active');
            }

            function fecharModalExit() {
                document.getElementById('exitModal').classList.remove('active');
            }

            function confirmarSaida() {
                // Redireciona para a rota real de Exit do teu Flask
                window.location.href = '/?option=exit';
            }

            // 2. Confirmação do Delete Antigo
            function confirmarDelete(event) {
                event.preventDefault(); 
                const certeza = confirm("🌸 Tens a certeza absoluta que queres eliminar este podcast?");
                if (certeza) {
                    window.location.href = '/?option=delete';
                }
            }

            // 3. Efeito de Foco nos Inputs
            const inputs = document.querySelectorAll('.meu-input');
            const card = document.getElementById('podcastCard');

            inputs.forEach(input => {
                input.addEventListener('focus', () => card.classList.add('input-focado'));
                input.addEventListener('blur', () => card.classList.remove('input-focado'));
            });
        </script>
    </body>
</html>
